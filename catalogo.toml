# Catalogo de executores do maestro.
# cota: de qual "bolso" o executor gasta. O orquestrador evita gastar o proprio bolso caro.
# custo: barato | medio | caro (relativo, dentro do bolso).
# poupar = true: so use se o usuario pedir ou se os baratos falharem 2 vezes.
# privado = false: provedor pode registrar o que recebe; nada com segredo.
#
# Ordem de gasto definida pelo usuario: 1) Ollama local (gratis)  2) OmniRoute (gratis)  3) agy  4) Claude Code.
# "--exec auto" usa a rota do --tipo abaixo: tenta o primeiro, e se a cota acabar passa ao proximo.
#
# nivel: o que o modelo aguenta. 1 ler/coletar/mecanico | 2 implementar com especificacao fechada |
#        3 implementacao delicada, depuracao, revisao | 4 arquitetura, causa raiz, decisao.
# Quem orquestra informa --eu (id ou nivel): "run" so desce para nivel igual ou menor, "consultar" sobe
# para o mais barato acima, na ordem de bolsos abaixo. Sessoes fora do catalogo: Fable/Opus = 4.

bolsos = ["local", "omniroute", "google", "anthropic"]

[rotas]
implementar = ["ollama-qwen-code", "ollama-gpt-oss", "omni-free-code", "agy-flash-high", "agy-hydrogen-medium", "cc-haiku"]
pequena     = ["ollama-gemma4", "ollama-qwen-code", "ollama-gpt-oss", "omni-free-fast", "omni-free-code", "agy-flash-medium", "cc-haiku"]
testes      = ["ollama-qwen-code", "ollama-gpt-oss", "omni-free-code", "agy-flash-high", "agy-hydrogen-medium", "cc-haiku"]
refatorar   = ["ollama-qwen-code", "ollama-gpt-oss", "omni-free-code", "agy-flash-high", "agy-hydrogen-medium", "cc-haiku"]
docs        = ["ollama-gemma4", "ollama-gpt-oss", "omni-free-fast", "omni-free-code", "agy-flash-medium", "cc-haiku"]
ler         = ["ollama-gemma4", "omni-free-fast", "ollama-qwen-code", "omni-free-code", "agy-flash-low", "cc-haiku"]
pesquisar   = ["ollama-qwen-code", "ollama-gpt-oss", "omni-free-code", "agy-flash-medium", "cc-haiku"]
dificil     = ["omni-credit-strong", "agy-hydrogen-high", "agy-argon-high", "agy-opus", "cc-sonnet"]

[ollama-gemma4]
cli = "ollama"
modelo = "gemma4:12b-it-qat"
cota = "local"
custo = "barato"
nivel = 1
privado = true
timeout = 900   # modelo local travado cede a vez em 15 min (max_saida: teto de tokens, padrao 16000)
forte = "leitura, coleta de fatos, tarefas pequenas e docs; 100% local e gratis (~7 GB)"
fraco = "modelo 12B local: nao use para implementacao complexa"

[ollama-qwen-code]
cli = "ollama"
modelo = "qwen3.6:35b-a3b-coding"
cota = "local"
custo = "barato"
nivel = 2
privado = true
timeout = 900   # modelo local travado cede a vez em 15 min (max_saida: teto de tokens, padrao 16000)
forte = "implementacao com especificacao fechada, testes e refatoracao; MoE 35B-A3B rapido, 100% local e gratis"
fraco = "consome ~22 GB de RAM/VRAM; escale se a tarefa exigir decisao de arquitetura"

[ollama-gpt-oss]
cli = "ollama"
modelo = "gpt-oss:20b"
cota = "local"
custo = "barato"
nivel = 2
privado = true
timeout = 900   # modelo local travado cede a vez em 15 min (max_saida: teto de tokens, padrao 16000)
forte = "fallback local nivel 2 para codigo geral, docs e tarefas pequenas (~14 GB)"
fraco = "menos especializado em codigo que o qwen3.6-coding"

[agy-flash-high]
cli = "agy"
modelo = "gemini-3.8-flash-high"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "implementacao com especificacao fechada, codigo bracal, testes, porte de codigo"
fraco = "diz 'aprovado' mesmo com verificacao falhando; precisa de arquivos e funcoes nomeados"

[agy-flash-medium]
cli = "agy"
modelo = "gemini-3.8-flash-medium"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "tarefas pequenas, edicoes em lote, scripts, documentacao"
fraco = "mesmo do flash-high, raciocina menos"

[agy-flash-low]
cli = "agy"
modelo = "gemini-3.8-flash-low"
cota = "google"
custo = "barato"
nivel = 1
privado = true
forte = "leitura, resumo de arquivo/log, extracao de fatos"
fraco = "nao use para codigo nao trivial"

[agy-gpt-oss]
cli = "agy"
modelo = "gpt-oss-120b-medium"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "segunda opiniao barata, tarefas simples quando o flash travar"
fraco = "menos testado aqui"

# Gemini 4 Hydrogen (agy >= 1.5.8): camada rapida do Gemini 4, derivada do Carbon; no "high" passa o Argon em
# parte dos benchmarks e custa menos. Contexto de 1M. Cota propria no agy (esgota separado do Flash).
[agy-hydrogen-medium]
cli = "agy"
modelo = "gemini-4-hydrogen-medium"
cota = "google"
custo = "medio"
nivel = 2
privado = true
forte = "implementacao com especificacao fechada quando o flash erra ou esta sem cota; contexto grande (1M)"
fraco = "mais caro que o flash; novo aqui, sem historico de acerto ainda"

[agy-hydrogen-high]
cli = "agy"
modelo = "gemini-4-hydrogen-high"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "tarefa dificil delegada e consulta de nivel 3 sem gastar Argon/Sonnet/Opus; depuracao com muito contexto"
fraco = "novo aqui, sem historico de acerto ainda"

[agy-hydrogen-xhigh]
cli = "agy"
modelo = "gemini-4-hydrogen-xhigh"
cota = "google"
custo = "medio"
nivel = 3
poupar = true
privado = true
forte = "depuracao pesada quando o hydrogen-high nao resolveu"
fraco = "raciocina muito: lento e gasta mais cota que o high"

[agy-argon-high]
cli = "agy"
modelo = "gemini-4-argon-high"
cota = "google"
custo = "caro"
nivel = 3
poupar = true
privado = true
forte = "tarefa dificil delegada, depuracao com muito contexto"
fraco = "cota pequena; ja acabou uma vez (volta em ~5 dias); prefira o agy-hydrogen-high antes"

[agy-sonnet]
cli = "agy"
modelo = "claude-sonnet-5-5-medium"
cota = "google"
custo = "caro"
nivel = 3
poupar = true
privado = true
forte = "implementacao delicada quando o flash falhou 2 vezes"
fraco = "gasta a cota cara do agy"

[agy-opus]
cli = "agy"
modelo = "claude-opus-5-5-high"
cota = "google"
custo = "caro"
nivel = 4
poupar = true
privado = true
forte = "o mais forte disponivel no agy; ultimo recurso para tarefa delegada muito dificil"
fraco = "gasta a cota cara do agy"

[cc-haiku]
cli = "claude"
modelo = "haiku"
cota = "anthropic"
custo = "barato"
nivel = 2
privado = true
forte = "leitura, busca, logs, tarefas mecanicas, testes; obedece bem a instrucoes"
fraco = "decisoes de design"

[cc-sonnet]
cli = "claude"
modelo = "sonnet"
cota = "anthropic"
custo = "caro"
nivel = 3
poupar = true
privado = true
forte = "implementacao com especificacao fechada, muito confiavel"
fraco = "gasta a cota cara do Claude"

[cc-opus]
cli = "claude"
modelo = "opus"
cota = "anthropic"
custo = "caro"
nivel = 4
poupar = true
privado = true
forte = "decisao de arquitetura e causa raiz quando um Sonnet precisa consultar acima"
fraco = "o mais caro do Claude; so para consulta curta"

[omni-free-code]
cli = "opencode"
modelo = "omniroute/free-code"
cota = "omniroute"
custo = "barato"
nivel = 2
privado = false
forte = "implementacao nao sensivel, gratis"
fraco = "provedores gratuitos podem registrar; limites diarios; qualidade varia"

[omni-free-fast]
cli = "opencode"
modelo = "omniroute/free-fast"
cota = "omniroute"
custo = "barato"
nivel = 1
privado = false
forte = "tarefas pequenas nao sensiveis"
fraco = "idem free-code"

[omni-free-safe]
cli = "opencode"
modelo = "omniroute/free-safe"
cota = "omniroute"
custo = "barato"
nivel = 2
privado = false
forte = "provedores mais conhecidos; melhor opcao gratis para codigo de cliente sem segredos"
fraco = "ainda e externo"

[omni-credit-strong]
cli = "opencode"
modelo = "omniroute/credit-strong"
cota = "omniroute"
custo = "medio"
nivel = 3
poupar = true
privado = false
forte = "tarefa dificil sem gastar agy/Claude (Kimi, GLM, DeepSeek Pro); gasta credito de cadastro"
fraco = "credito acaba; provedores externos"
