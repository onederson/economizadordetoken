# Catalogo de executores do maestro.
# cota: de qual "bolso" o executor gasta. O orquestrador evita gastar o proprio bolso caro.
# custo: barato | medio | caro (relativo, dentro do bolso).
# poupar = true: so use se o usuario pedir ou se os baratos falharem 2 vezes.
# privado = false: provedor pode registrar o que recebe; nada com segredo.
#
# Ordem de gasto definida pelo usuario: 1) Ollama local (gratis)  2) OmniRoute (gratis)  3) agy  4) Claude Code.
# "--exec auto" usa a rota do --tipo abaixo: tenta o primeiro, e se a cota acabar passa ao proximo.
#
# nivel: o que o modelo aguenta. 1 ler/coletar/mecanico | 2 implementar com especificacao fechada |
#        3 implementacao delicada, depuracao, revisao | 4 arquitetura, causa raiz, decisao.
# Quem orquestra informa --eu (id ou nivel): "run" so desce para nivel igual ou menor, "consultar" sobe
# para o mais barato acima, na ordem de bolsos abaixo. Sessoes fora do catalogo: Fable/Opus = 4.

bolsos = ["local", "omniroute", "google", "anthropic"]

[rotas]
# 2026-11-26: o agy tira Gemini 3.8 Flash, Gemini 4 Argon e GPT-OSS-120b em 2026-11-30 (antigravity.google/docs/models).
# O Gemini 4 Hydrogen assume o lugar do Flash, por esforco: flash-high -> hydrogen-high, medium -> medium,
# low -> low. Hydrogen e um bolso de cota so: nao adianta cair de hydrogen para hydrogen quando a cota acaba.
# O ordenar_por_acerto do maestro reordena sozinho pelo historico: quem perde para o melhor da rota vai para o fim.
implementar = ["agy-hydrogen-high", "omni-free-code", "cc-haiku"]
pequena     = ["ollama-gpt-oss", "omni-free-fast", "agy-hydrogen-medium", "ollama-gemma4", "cc-haiku"]
testes      = ["agy-hydrogen-high", "omni-free-code", "cc-haiku"]
refatorar   = ["agy-hydrogen-high", "omni-free-code", "cc-haiku"]
docs        = ["ollama-gpt-oss", "ollama-gemma4", "omni-free-fast", "agy-hydrogen-low", "cc-haiku"]
ler         = ["ollama-gemma4", "ollama-gpt-oss", "omni-free-fast", "agy-hydrogen-low", "cc-haiku"]
pesquisar   = ["agy-hydrogen-medium", "omni-free-code", "cc-haiku"]
dificil     = ["omni-credit-strong", "agy-hydrogen-xhigh", "agy-neon-high", "agy-carbon-high", "agy-opus", "cc-sonnet"]

[ollama-gemma4]
cli = "ollama"
modelo = "gemma4:12b-64k"   # gemma4:12b-it-qat + num_ctx 65536; 7,8 GB, 100% GPU
cota = "local"
custo = "barato"
nivel = 1
privado = true
timeout = 300   # local que nao entrega em 5 min cede a vez (antes 900 s = 15 min perdidos por falha)
contexto = 65536   # num_ctx do modelo: o Claude Code compacta antes do ollama cortar a tarefa
forte = "leitura, coleta de fatos, tarefas pequenas e docs; 100% local e gratis (~7 GB)"
fraco = "modelo 12B local: nao use para implementacao complexa"

[ollama-qwen-code]
cli = "ollama"
modelo = "qwen3.6:35b-a3b-coding"
cota = "local"
custo = "barato"
nivel = 2
privado = true
timeout = 300   # local que nao entrega em 5 min cede a vez (antes 900 s = 15 min perdidos por falha)
forte = "implementacao com especificacao fechada, testes e refatoracao; MoE 35B-A3B rapido, 100% local e gratis"
fraco = "22 GB NAO cabe na GPU de 16 GB (40% roda na CPU, lento); fora das rotas. consome ~22 GB de RAM/VRAM; escale se a tarefa exigir decisao de arquitetura"

[ollama-gpt-oss]
cli = "ollama"
modelo = "gpt-oss:20b-64k"   # gpt-oss:20b + num_ctx 65536; 12 GB, 100% GPU (RTX 5060 Ti 16 GB)
cota = "local"
custo = "barato"
nivel = 2
privado = true
timeout = 300   # local que nao entrega em 5 min cede a vez (antes 900 s = 15 min perdidos por falha)
contexto = 65536
forte = "docs e tarefas pequenas, 100% local na GPU, ~87 tokens/s"
fraco = "perdeu feio em implementar (0 de 10): fora das rotas de codigo"

# Gemini 4 Hydrogen (agy >= 1.5.8): camada rapida do Gemini 4, derivada do Carbon; no "high" passa o Argon em
# parte dos benchmarks e custa menos. Contexto de 1M. Disponivel em todos os planos;
# substitui o Gemini 3.8 Flash, que sai do agy em 2026-11-30.
[agy-hydrogen-low]
cli = "agy"
modelo = "gemini-4-hydrogen-low"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "leitura, resumo de arquivo/log, docs e tarefas pequenas; raciocina pouco e e rapido (papel do antigo flash-low)"
fraco = "nao use para codigo nao trivial"

[agy-hydrogen-medium]
cli = "agy"
modelo = "gemini-4-hydrogen-medium"
cota = "google"
custo = "medio"
nivel = 2
privado = true
forte = "tarefas pequenas, edicoes em lote, scripts, pesquisa; contexto grande (1M) (papel do antigo flash-medium)"
fraco = "raciocina menos que o high; precisa de arquivos e funcoes nomeados"

[agy-hydrogen-high]
cli = "agy"
modelo = "gemini-4-hydrogen-high"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "implementacao com especificacao fechada, testes, refatoracao (papel do antigo flash-high); consulta de nivel 3 sem gastar Neon/Sonnet/Opus"
fraco = "precisa de arquivos e funcoes nomeados; confira o diff, nao o APROVADO que ele escreve"

# Gemini 4 Neon (agy >= 1.5.12): camada intermediaria do Gemini 4, entre Hydrogen (rapido) e Carbon (topo);
# quase de fronteira, focada em codigo agentico e raciocinio de varios passos. E planejador do "Orchestrator (Neon)".
[agy-neon-medium]
cli = "agy"
modelo = "gemini-4-neon-medium"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "implementacao delicada e revisao de diff; faz menos mudancas nao pedidas"
fraco = "novo aqui (agy 1.5.12), sem historico de acerto ainda"

[agy-neon-high]
cli = "agy"
modelo = "gemini-4-neon-high"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "tarefa dificil delegada quando o hydrogen nao resolveu; depuracao, teste de hipoteses"
fraco = "novo aqui (agy 1.5.12), sem historico de acerto ainda"

[agy-neon-xhigh]
cli = "agy"
modelo = "gemini-4-neon-xhigh"
cota = "google"
custo = "caro"
nivel = 4
poupar = true
privado = true
forte = "consulta de nivel 4 (arquitetura, causa raiz) antes de gastar o Carbon e o Opus"
fraco = "raciocina muito: lento; novo aqui, sem historico de acerto ainda"

# Gemini 4 Carbon: o topo do Gemini 4 (low/medium/high, sem xhigh). Fica entre o Neon xhigh e o Opus do agy: no
# consultar, dentro do nivel 4 e do bolso google, a ordem do catalogo decide quem vem primeiro.
[agy-carbon-high]
cli = "agy"
modelo = "gemini-4-carbon-high"
cota = "google"
custo = "caro"
nivel = 4
poupar = true
privado = true
forte = "arquitetura, causa raiz, decisao sem volta quando o Neon xhigh nao bastou; tarefa delegada muito dificil antes do Opus"
fraco = "topo do Gemini 4: cota menor; novo aqui (agy 1.5.18), sem historico de acerto ainda"

[agy-hydrogen-xhigh]
cli = "agy"
modelo = "gemini-4-hydrogen-xhigh"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "tarefa dificil delegada e depuracao pesada; ocupa o lugar do Argon, que sai do agy em 2026-11-30"
fraco = "raciocina muito: lento e gasta mais cota que o high"

[agy-sonnet]
cli = "agy"
modelo = "claude-sonnet-5-5-medium"
cota = "google"
custo = "caro"
nivel = 3
poupar = true
privado = true
forte = "implementacao delicada quando o hydrogen falhou 2 vezes"
fraco = "gasta a cota cara do agy"

[agy-opus]
cli = "agy"
modelo = "claude-opus-5-5-high"
cota = "google"
custo = "caro"
nivel = 4
poupar = true
privado = true
forte = "o mais forte disponivel no agy; ultimo recurso para tarefa delegada muito dificil"
fraco = "gasta a cota cara do agy"

[cc-haiku]
cli = "claude"
modelo = "haiku"
cota = "anthropic"
custo = "barato"
nivel = 2
privado = true
forte = "leitura, busca, logs, tarefas mecanicas, testes; obedece bem a instrucoes"
fraco = "decisoes de design"

[cc-sonnet]
cli = "claude"
modelo = "sonnet"
cota = "anthropic"
custo = "caro"
nivel = 3
poupar = true
privado = true
forte = "implementacao com especificacao fechada, muito confiavel"
fraco = "gasta a cota cara do Claude"

[cc-opus]
cli = "claude"
modelo = "opus"
cota = "anthropic"
custo = "caro"
nivel = 4
poupar = true
privado = true
forte = "decisao de arquitetura e causa raiz quando um Sonnet precisa consultar acima"
fraco = "o mais caro do Claude; so para consulta curta"

[omni-free-code]
cli = "opencode"
modelo = "omniroute/free-code"
cota = "omniroute"
custo = "barato"
nivel = 2
privado = false
forte = "implementacao nao sensivel, gratis"
fraco = "provedores gratuitos podem registrar; limites diarios; qualidade varia"

[omni-free-fast]
cli = "opencode"
modelo = "omniroute/free-fast"
cota = "omniroute"
custo = "barato"
nivel = 1
privado = false
forte = "tarefas pequenas nao sensiveis"
fraco = "idem free-code"

[omni-free-safe]
