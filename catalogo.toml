# Catalogo de executores do maestro.
# cota: de qual "bolso" o executor gasta. O orquestrador evita gastar o proprio bolso caro.
# custo: barato | medio | caro (relativo, dentro do bolso).
# poupar = true: so use se o usuario pedir ou se os baratos falharem 2 vezes.
# privado = false: provedor pode registrar o que recebe; nada com segredo.
#
# Ordem de gasto definida pelo usuario: 1) Ollama local (gratis)  2) OmniRoute (gratis)  3) agy  4) Claude Code.
# "--exec auto" usa a rota do --tipo abaixo: tenta o primeiro, e se a cota acabar passa ao proximo.
#
# nivel: o que o modelo aguenta. 1 ler/coletar/mecanico | 2 implementar com especificacao fechada |
#        3 implementacao delicada, depuracao, revisao | 4 arquitetura, causa raiz, decisao.
# Quem orquestra informa --eu (id ou nivel): "run" so desce para nivel igual ou menor, "consultar" sobe
# para o mais barato acima, na ordem de bolsos abaixo. Sessoes fora do catalogo: Fable/Opus = 4.

bolsos = ["local", "omniroute", "google", "anthropic"]

[rotas]
# 2026-11-24: rotas de codigo comecam no agy-flash-high (85/95 juntados) e o Ollama saiu delas (local: 2 de 27
# rodadas aproveitadas). Qualidade antes de custo, aprovado pelo usuario. O ordenar_por_acerto do maestro ainda
# reordena sozinho pelo historico: quem perde para o melhor da rota vai para o fim.
implementar = ["agy-flash-high", "omni-free-code", "agy-hydrogen-medium", "cc-haiku"]
pequena     = ["ollama-gpt-oss", "omni-free-fast", "agy-flash-medium", "ollama-gemma4", "agy-hydrogen-low", "cc-haiku"]
testes      = ["agy-flash-high", "omni-free-code", "agy-hydrogen-medium", "cc-haiku"]
refatorar   = ["agy-flash-high", "omni-free-code", "agy-hydrogen-medium", "cc-haiku"]
docs        = ["ollama-gpt-oss", "ollama-gemma4", "omni-free-fast", "agy-flash-medium", "agy-hydrogen-low", "cc-haiku"]
ler         = ["ollama-gemma4", "ollama-gpt-oss", "omni-free-fast", "agy-flash-low", "cc-haiku"]
pesquisar   = ["agy-flash-medium", "omni-free-code", "agy-hydrogen-low", "cc-haiku"]
dificil     = ["omni-credit-strong", "agy-hydrogen-high", "agy-neon-high", "agy-argon-high", "agy-opus", "cc-sonnet"]

[ollama-gemma4]
cli = "ollama"
modelo = "gemma4:12b-64k"   # gemma4:12b-it-qat + num_ctx 65536; 7,8 GB, 100% GPU
cota = "local"
custo = "barato"
nivel = 1
privado = true
timeout = 300   # local que nao entrega em 5 min cede a vez (antes 900 s = 15 min perdidos por falha)
contexto = 65536   # num_ctx do modelo: o Claude Code compacta antes do ollama cortar a tarefa
forte = "leitura, coleta de fatos, tarefas pequenas e docs; 100% local e gratis (~7 GB)"
fraco = "modelo 12B local: nao use para implementacao complexa"

[ollama-qwen-code]
cli = "ollama"
modelo = "qwen3.6:35b-a3b-coding"
cota = "local"
custo = "barato"
nivel = 2
privado = true
timeout = 300   # local que nao entrega em 5 min cede a vez (antes 900 s = 15 min perdidos por falha)
forte = "implementacao com especificacao fechada, testes e refatoracao; MoE 35B-A3B rapido, 100% local e gratis"
fraco = "22 GB NAO cabe na GPU de 16 GB (40% roda na CPU, lento); fora das rotas. consome ~22 GB de RAM/VRAM; escale se a tarefa exigir decisao de arquitetura"

[ollama-gpt-oss]
cli = "ollama"
modelo = "gpt-oss:20b-64k"   # gpt-oss:20b + num_ctx 65536; 12 GB, 100% GPU (RTX 5060 Ti 16 GB)
cota = "local"
custo = "barato"
nivel = 2
privado = true
timeout = 300   # local que nao entrega em 5 min cede a vez (antes 900 s = 15 min perdidos por falha)
contexto = 65536
forte = "docs e tarefas pequenas, 100% local na GPU, ~87 tokens/s"
fraco = "perdeu feio em implementar (0 de 10): fora das rotas de codigo"

[agy-flash-high]
cli = "agy"
modelo = "gemini-3.8-flash-high"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "implementacao com especificacao fechada, codigo bracal, testes, porte de codigo"
fraco = "diz 'aprovado' mesmo com verificacao falhando; precisa de arquivos e funcoes nomeados"

[agy-flash-medium]
cli = "agy"
modelo = "gemini-3.8-flash-medium"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "tarefas pequenas, edicoes em lote, scripts, documentacao"
fraco = "mesmo do flash-high, raciocina menos"

[agy-flash-low]
cli = "agy"
modelo = "gemini-3.8-flash-low"
cota = "google"
custo = "barato"
nivel = 1
privado = true
forte = "leitura, resumo de arquivo/log, extracao de fatos"
fraco = "nao use para codigo nao trivial"

[agy-gpt-oss]
cli = "agy"
modelo = "gpt-oss-120b-medium"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "segunda opiniao barata, tarefas simples quando o flash travar"
fraco = "menos testado aqui"

# Gemini 4 Hydrogen (agy >= 1.5.8): camada rapida do Gemini 4, derivada do Carbon; no "high" passa o Argon em
# parte dos benchmarks e custa menos. Contexto de 1M. Cota propria no agy (esgota separado do Flash).
[agy-hydrogen-low]
cli = "agy"
modelo = "gemini-4-hydrogen-low"
cota = "google"
custo = "barato"
nivel = 2
privado = true
forte = "tarefa pequena e docs quando o flash esta sem cota; raciocina pouco e e rapido"
fraco = "novo aqui (agy 1.5.12), sem historico de acerto ainda"

[agy-hydrogen-medium]
cli = "agy"
modelo = "gemini-4-hydrogen-medium"
cota = "google"
custo = "medio"
nivel = 2
privado = true
forte = "implementacao com especificacao fechada quando o flash erra ou esta sem cota; contexto grande (1M)"
fraco = "mais caro que o flash; novo aqui, sem historico de acerto ainda"

[agy-hydrogen-high]
cli = "agy"
modelo = "gemini-4-hydrogen-high"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "tarefa dificil delegada e consulta de nivel 3 sem gastar Argon/Sonnet/Opus; depuracao com muito contexto"
fraco = "novo aqui, sem historico de acerto ainda"

# Gemini 4 Neon (agy >= 1.5.12): camada intermediaria do Gemini 4, entre Hydrogen (rapido) e Carbon (topo);
# quase de fronteira, focada em codigo agentico e raciocinio de varios passos. E planejador do "Orchestrator (Neon)".
[agy-neon-medium]
cli = "agy"
modelo = "gemini-4-neon-medium"
cota = "google"
custo = "medio"
nivel = 3
privado = true
forte = "implementacao delicada e revisao de diff; faz menos mudancas nao pedidas"
fraco = "novo aqui (agy 1.5.12), sem historico de acerto ainda"

